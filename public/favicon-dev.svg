<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#F8FAFC" />
  <g transform="translate(50, 50) scale(1.3) translate(-50, -50)">
    <!-- 模擬些微的外發光/殘影 -->
    <polygon points="50,15 85,35 85,65 50,85 15,65 15,35" fill="none" stroke="#0891B2" stroke-width="5" opacity="0.3" />
    <!-- 主體線條 -->
    <polygon points="50,15 85,35 85,65 50,85 15,65 15,35" fill="none" stroke="#0E7490" stroke-width="3" />
    <!-- 內部結構 -->
    <polyline points="50,50 50,85" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/>
    <polyline points="15,35 50,50" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/>
    <polyline points="85,35 50,50" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/>
    <!-- 核心發光點 -->
    <circle cx="50" cy="50" r="4.5" fill="#164E63" />
  </g>
</svg>
