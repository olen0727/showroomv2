<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#09090B" />
  <g transform="translate(50, 50) scale(1.3) translate(-50, -50)">
    <!-- 模擬些微的外發光/殘影 -->
    <polygon points="50,15 85,35 85,65 50,85 15,65 15,35" fill="none" stroke="#06B6D4" stroke-width="5" opacity="0.4" />
    <!-- 主體線條 -->
    <polygon points="50,15 85,35 85,65 50,85 15,65 15,35" fill="none" stroke="#67E8F9" stroke-width="3" />
    <!-- 內部結構 -->
    <polyline points="50,50 50,85" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
    <polyline points="15,35 50,50" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
    <polyline points="85,35 50,50" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
    <!-- 核心發光點 -->
    <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
  </g>
</svg>
